name: Auto Scrape Meigen to Telegram

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py

      - name: Commit and Force Push Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # بررسی اینکه آیا فایلی تغییر کرده است یا خیر
          if [ -n "$(git status --porcelain sent_prompts.json)" ]; then
            echo "ذخیره تغییرات sent_prompts.json..."
            # دریافت آخرین وضعیت ریموت برای جلوگیری از ناهمگامی
            git fetch origin main
            git checkout origin/main -- sent_prompts.json || true
            
            # اجرای مجدد ذخیره دیتای تولید شده
            git add sent_prompts.json
            git commit -m "chore: update sent prompts [skip ci]" || exit 0
            
            # پوش با هندلینگ همگام‌سازی مستقیم
            git push origin HEAD:main
          else
            echo "تغییری در دیتابیس ایجاد نشد."
          fi
