- name: Commit and Push sent_prompts.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # دریافت آخرین وضعیت مخزن از گیت‌هاب بدون بازنویسی فایل محلی
          git fetch origin main
          
          # استیج کردن فایل تغییر یافته
          git add sent_prompts.json
          
          if ! git diff --staged --quiet; then
            echo "💾 ثبت تغییرات در سابقه..."
            git commit -m "chore: update sent prompts [skip ci]"
            
            # ادغام با اولویت کامل دادن به تغییرات رانر
            git merge origin/main -X ours -m "chore: merge remote changes [skip ci]" || true
            
            # پوش نهایی
            git push origin HEAD:main
          else
            echo "ℹ️ تغییری در فایل رخ نداده است."
          fi
