name: Auto Scrape Meigen to Telegram

on:
  schedule:
    # اجرا در دقیقه 0 هر ساعت (UTC)
    - cron: '0 * * * *'
  # امکان اجرای دستی از تب Actions در صورت نیاز
  workflow_dispatch:

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python main.py  # اگر نام فایل شما چیزی غیر از main.py است، آن را اصلاح کنید

      - name: Commit and push changes (sent_prompts.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_prompts.json
          git diff --staged --quiet || (
            git commit -m "chore: update sent prompts [skip ci]"
            # در صورت وجود کانفلیکت، نسخه فایل اسکریپت برنده است:
            git pull origin main --rebase -X theirs || git rebase --abort
            git push origin main
          )
