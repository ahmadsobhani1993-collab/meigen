name: Auto Scrape Meigen to Telegram

on:
  schedule:
    # اجرا هر یک ساعت یک‌بار سر دقیقه 0
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py

      - name: Commit and Push sent_prompts.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # استیج کردن فایل ذخیره شده
          git add sent_prompts.json
          
          if ! git diff --staged --quiet; then
            echo "💾 ثبت تغییرات در سابقه..."
            git commit -m "chore: update sent prompts [skip ci]"
            git fetch origin main
            git merge origin/main -X ours -m "chore: merge remote changes [skip ci]" || true
            git push origin HEAD:main
          else
            echo "ℹ️ تغییری در فایل رخ نداده است."
          fi
